name: MixChannel 5分リレー

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mixch-ranking-monitor-relay
  cancel-in-progress: false

jobs:
  wait-and-dispatch:
    if: ${{ vars.RELAY_ENABLED != 'false' }}
    environment: five-minute-delay
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 日本時間の稼働時間を確認
        id: active_hours
        shell: bash
        run: |
          set -euo pipefail
          current_hour_text="$(TZ=Asia/Tokyo date +%H)"
          current_hour=$((10#$current_hour_text))

          if (( current_hour >= 7 && current_hour < 22 )); then
            echo "monitor_enabled=true" >> "$GITHUB_OUTPUT"
            echo "日本時間${current_hour_text}時台のため、監視を起動します。"
          else
            echo "monitor_enabled=false" >> "$GITHUB_OUTPUT"
            echo "日本時間${current_hour_text}時台は停止時間（22:00〜翌07:00）のため、監視を起動しません。"
          fi

      - name: 本番監視を起動
        if: ${{ steps.active_hours.outputs.monitor_enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run ranking-monitor.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f dry_run=false \
              -f test_webhook=false; then
              exit 0
            fi
            echo "監視起動に失敗しました（$attempt/3）。5秒後に再試行します。"
            sleep 5
          done
          exit 1

      - name: 次回リレーを予約
        if: ${{ always() && vars.RELAY_ENABLED != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run relay.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main; then
              exit 0
            fi
            echo "次回リレーの予約に失敗しました（$attempt/3）。5秒後に再試行します。"
            sleep 5
          done
          exit 1
