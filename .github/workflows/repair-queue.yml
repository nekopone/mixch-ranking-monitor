name: One-time monitor smoke test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-queue.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Dispatch production monitor
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run monitor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f dry_run=false \
            -f test_webhook=false \
            -f threshold_override=150
